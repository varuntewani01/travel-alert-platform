spring.application.name=travel-alert-platform


spring.datasource.url=jdbc:h2:mem:traveld;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Default profile uses mock providers. Use "live" to hit real APIs (later).
spring.profiles.active=mock

# Scheduler poll interval (used in Phase 5)
traveld.poll.fixed-delay-ms=60000

